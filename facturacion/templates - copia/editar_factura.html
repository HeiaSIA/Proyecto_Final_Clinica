{% load static %}
{% include 'private/header.html' %}

<main class="dashboard-content">
  <div class="container-fluid px-3 px-lg-4 py-4">

    <div class="row align-items-center mb-4">
      <div class="col-md-8">
        <h1 class="h3 mb-1">Editar Factura #{{ factura.id }}</h1>
        <p class="text-muted mb-0">Si modificas el subtotal, el IVA y Total se recalcularán automáticamente.</p>
      </div>
      <div class="col-md-4 text-md-end">
        <a href="{% url 'index_facturas' %}" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i> Volver al historial
        </a>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <form method="POST">
              {% csrf_token %}
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold">Paciente</label>
                  <select name="paciente" class="form-select" required>
                    {% for p in pacientes %}
                      <option value="{{ p.id }}" {% if p.id == factura.paciente.id %}selected{% endif %}>
                        {{ p.nombre }} {{ p.apellido }}
                      </option>
                    {% endfor %}
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-bold">Subtotal ($)</label>
                  <input type="number" step="0.01" min="0" name="subtotal" class="form-control" value="{{ factura.subtotal }}" required>
                </div>

                <div class="col-12">
                  <label class="form-label fw-bold">Concepto / Detalle del servicio</label>
                  <input type="text" name="concepto" class="form-control" value="{{ factura.concepto }}" required>
                </div>

                <div class="col-12 mt-4 d-flex justify-content-end gap-2">
                  <a href="{% url 'index_facturas' %}" class="btn btn-light">Cancelar</a>
                  <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-pencil-square me-1"></i> Actualizar Factura
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

{% include 'private/footer.html' %}
