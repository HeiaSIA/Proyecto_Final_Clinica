{% load static %}
{% include 'private/header.html' %}

<main class="dashboard-content">
  <div class="container-fluid px-3 px-lg-4 py-4">

    <!-- Encabezado -->
    <div class="row align-items-center mb-4">
      <div class="col-md-8">
        <h1 class="h3 mb-1">Agendar Nueva Cita</h1>
        <p class="text-muted mb-0">Asigna un paciente con un profesional médico en la agenda.</p>
      </div>
      <div class="col-md-4 mt-3 mt-md-0 text-md-end">
        <a href="{% url 'index_citas' %}" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i> Volver al listado
        </a>
      </div>
    </div>

    <!-- Formulario en Card -->
    <div class="row">
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <form method="POST">
              {% csrf_token %}

              <div class="row g-3">
                
                <!-- Seleccionar Paciente -->
                <div class="col-md-6">
                  <label for="paciente" class="form-label fw-bold">Paciente</label>
                  <select name="paciente" id="paciente" class="form-select" required>
                    <option value="" selected disabled>Seleccione un paciente...</option>
                    {% for p in pacientes %}
                      <option value="{{ p.id }}">{{ p.nombre }} {{ p.apellido }}</option>
                    {% endfor %}
                  </select>
                </div>

                <!-- Seleccionar Médico -->
                <div class="col-md-6">
                  <label for="medico" class="form-label fw-bold">Médico Tratante</label>
                  <select name="medico" id="medico" class="form-select" required>
                    <option value="" selected disabled>Seleccione un médico...</option>
                    {% for m in medicos %}
                      <option value="{{ m.id }}">Dr(a). {{ m.nombres }} {{ m.apellidos }} ({{ m.especialidad }})</option>
                    {% endfor %}
                  </select>
                </div>

                <!-- Fecha de la Cita -->
                <div class="col-md-6">
                  <label for="fecha" class="form-label fw-bold">Fecha</label>
                  <input type="date" name="fecha" id="fecha" class="form-control" required>
                </div>

                <!-- Hora de la Cita -->
                <div class="col-md-6">
                  <label for="hora" class="form-label fw-bold">Hora</label>
                  <input type="time" name="hora" id="hora" class="form-control" required>
                </div>

                <!-- Motivo o Observaciones -->
                <div class="col-12">
                  <label for="motivo" class="form-label fw-bold">Motivo de la Consulta</label>
                  <textarea name="motivo" id="motivo" class="form-control" rows="3" placeholder="Descripción breve del síntoma o motivo de atención..."></textarea>
                </div>

                <!-- Botones de Acción -->
                <div class="col-12 mt-4 d-flex justify-content-end gap-2">
                  <a href="{% url 'index_citas' %}" class="btn btn-light">Cancelar</a>
                  <button type="submit" class="btn btn-success px-4">
                    <i class="bi bi-save me-1"></i> Agendar Cita
                  </button>
                </div>

              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

{% include 'private/footer.html' %}
