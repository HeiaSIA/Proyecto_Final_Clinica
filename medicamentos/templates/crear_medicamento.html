{% load static %}
{% include 'private/header.html' %}

<main class="dashboard-content">
  <div class="container-fluid px-3 px-lg-4 py-4">

    <div class="row align-items-center mb-4">
      <div class="col-md-8">
        <h1 class="h3 mb-1">Nuevo Medicamento</h1>
        <p class="text-muted mb-0">Ingresa los datos para dar de alta un producto en farmacia.</p>
      </div>
      <div class="col-md-4 text-md-end">
        <a href="{% url 'index_medicamentos' %}" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i> Volver al listado
        </a>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <form method="POST">
              {% csrf_token %}
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold">Nombre del Medicamento</label>
                  <input type="text" name="nombre" class="form-control" placeholder="Ej: Paracetamol 500mg" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Lote</label>
                  <input type="text" name="lote" class="form-control" placeholder="Ej: LOTE-2024-A" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Cantidad en Stock</label>
                  <input type="number" min="0" name="stock" class="form-control" placeholder="0" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Precio Unitario ($)</label>
                  <input type="number" step="0.01" min="0" name="precio_unitario" class="form-control" placeholder="0.00" required>
                </div>

                <div class="col-12 mt-4 d-flex justify-content-end gap-2">
                  <a href="{% url 'index_medicamentos' %}" class="btn btn-light">Cancelar</a>
                  <button type="submit" class="btn btn-success px-4">
                    <i class="bi bi-save me-1"></i> Guardar Medicamento
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

{% include 'private/footer.html' %}
