{% load static %}
{% include 'private/header.html' %}

<main class="dashboard-content">
  <div class="container-fluid px-3 px-lg-4 py-4">

    <div class="mb-4">
      <h1 class="h3 mb-1">Registrar Nuevo Paciente</h1>
      <p class="text-muted mb-0">Completa los datos solicitados.</p>
    </div>

    <div class="card shadow-sm border-0" style="max-width: 800px;">
      <div class="card-body p-4">
        
        <form action="{% url 'crear_paciente' %}" method="POST">
          {% csrf_token %}

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="nombre" class="form-label fw-bold">Nombres</label>
              <input type="text" class="form-control" id="nombre" name="nombre" required pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras">
            </div>
            <div class="col-md-6 mt-3 mt-md-0">
              <label for="apellido" class="form-label fw-bold">Apellidos</label>
              <input type="text" class="form-control" id="apellido" name="apellido" required pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" title="Solo se permiten letras">
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="cedula" class="form-label fw-bold">Cédula / DNI</label>
              <input type="text" class="form-control" id="cedula" name="cedula" required minlength="10" maxlength="20" pattern="[0-9]+" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <div class="col-md-6 mt-3 mt-md-0">
              <label for="fecha_nacimiento" class="form-label fw-bold">Fecha de Nacimiento</label>
              <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>
          </div>

          <div class="row mb-4">
            <div class="col-md-6">
              <label for="telefono" class="form-label fw-bold">Teléfono</label>
              <input type="tel" class="form-control" id="telefono" name="telefono" required maxlength="20" pattern="[0-9]+" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <div class="col-md-6 mt-3 mt-md-0">
              <label for="direccion" class="form-label fw-bold">Dirección</label>
              <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Ej. Calle Principal 123">
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="{% url 'index_pacientes' %}" class="btn btn-secondary"><i class="bi bi-x-circle me-1"></i> Cancelar</a>
            <button type="submit" class="btn btn-success"><i class="bi bi-save me-1"></i> Guardar Paciente</button>
          </div>
          
        </form>
      </div>
    </div>
  </div>
</main>

{% include 'private/footer.html' %}
