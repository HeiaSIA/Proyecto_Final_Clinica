{% include 'private/header.html' %}

<main class="dashboard-content">
  <div class="container-fluid px-3 px-lg-4 py-4">
    <div class="page-heading">
      <div class="page-heading-copy">
        <span class="page-icon"><i class="bi bi-speedometer2" aria-hidden="true"></i></span>
        <div>
          <p class="eyebrow mb-1">Resumen</p>
          <h1 class="h3 mb-1">Dashboard</h1>
          <p class="text-muted mb-0">Monitorea el rendimiento del sistema desde un solo lugar.</p>
        </div>
      </div>
      <div class="heading-actions">
        <button class="btn btn-outline-secondary btn-sm" type="button"><i class="bi bi-download"></i> Exportar</button>
        <button class="btn btn-primary btn-sm" type="button"><i class="bi bi-file-earmark-plus"></i> Crear Reporte</button>
      </div>
    </div>

    <!-- Tarjetas de Métricas -->
    <section class="row g-3 mt-1" aria-label="Dashboard metrics">
      <div class="col-12 col-sm-6 col-xl-3">
        <article class="metric-card metric-primary">
          <div class="metric-top">
            <span class="metric-label">Ingresos</span>
            <span class="metric-icon"><i class="bi bi-currency-dollar"></i></span>
          </div>
          <div class="metric-value">$48,240</div>
        </article>
      </div>

      <div class="col-12 col-sm-6 col-xl-3">
        <article class="metric-card metric-success">
          <div class="metric-top">
            <span class="metric-label">Pacientes</span>
            <span class="metric-icon"><i class="bi bi-people"></i></span>
          </div>
          <div class="metric-value">1,284</div>
        </article>
      </div>
    </section>

    <!-- Aquí va el resto de tus paneles, tablas o gráficos -->

  </div>
</main>
